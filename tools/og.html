<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Swapsteal OG image</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#fbf7f0;color:#1d2a24;position:relative}
.band{position:absolute;right:0;top:0;width:520px;height:630px;background:#17603f}
.dots{position:absolute;right:0;top:0;width:520px;height:630px;opacity:.12;background-image:radial-gradient(#fbf7f0 2px,transparent 2.5px);background-size:28px 28px}
.left{position:absolute;left:80px;top:72px;width:600px}
.brand{display:flex;align-items:center;gap:22px}
.brand b{font-size:64px;font-weight:800;letter-spacing:-1.5px}
h1{margin-top:52px;font-size:68px;line-height:1.04;font-weight:800;letter-spacing:-2px}
p.sub{margin-top:26px;font-size:28px;line-height:1.35;color:#6b756f;font-weight:600;max-width:560px}
h1 em{font-style:normal;color:#17603f}
.foot{position:absolute;left:80px;bottom:64px;display:flex;gap:14px}
.pill{font-size:24px;font-weight:700;padding:12px 22px;border-radius:999px;background:#fff;border:2px solid #e6dfd2;color:#1d2a24}
.cards{position:absolute;left:740px;top:70px;width:400px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:18px;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.card .g{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center}
.card .t{font-size:26px;font-weight:800;line-height:1.15}
.card .s{font-size:19px;color:#6b756f;margin-top:4px;font-weight:600}
.steal{color:#c8323c!important}
.frozen{border:3px solid #e9b44c}
.frozen .s{color:#8a6414}
.tilt1{transform:rotate(-2deg) translateX(-14px)}
.tilt2{transform:rotate(1.5deg) translateX(18px)}
.tilt3{transform:rotate(-1deg)}
.turn{position:absolute;left:740px;bottom:62px;width:400px;background:#c8323c;color:#fff;border-radius:16px;padding:18px 24px;font-size:24px;font-weight:800;display:flex;justify-content:space-between;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.turn span{font-weight:600;opacity:.9;font-size:20px}
</style></head><body>
<div class="band"></div><div class="dots"></div>
<div class="left">

  <h1>White elephant on <em>everyone's phone</em></h1>
  <p class="sub">Share a link, draw the turn order, then open a gift or steal one.</p>
</div>
<div class="foot"><span class="pill">Free</span><span class="pill">No sign-up</span><span class="pill">No app</span></div>
<div class="cards">
  <div class="card tilt1"><div class="g" style="background:#fde8e9"><svg width="34" height="34" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#c8323c"/><rect x="2" y="6" width="20" height="5" rx="1.5" fill="#e0525b"/><rect x="11" y="6" width="2" height="15" fill="#fff"/></svg></div><div><div class="t">Heated blanket</div><div class="s steal">Stolen 2×</div></div></div>
  <div class="card frozen tilt2"><div class="g" style="background:#fbf0d6"><svg width="34" height="34" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="#e9b44c"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#e9b44c" stroke-width="2.6"/><circle cx="12" cy="15.5" r="1.8" fill="#fff"/></svg></div><div><div class="t">Espresso maker</div><div class="s">Frozen · stolen 3×</div></div></div>
  <div class="card tilt3"><div class="g" style="background:#e3f0e8"><svg width="34" height="34" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#17603f"/><rect x="2" y="6" width="20" height="5" rx="1.5" fill="#2a7d56"/><rect x="11" y="6" width="2" height="15" fill="#fff"/></svg></div><div><div class="t">Board game</div><div class="s">Opened by Sam</div></div></div>
</div>
<div class="turn">Maya's turn <span>Open or steal</span></div>
</body></html>
